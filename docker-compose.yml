version: "3.8"

services:
  # PostgreSQL Database (replaces SQLite for production-ready local dev)
  db:
    image: postgres:15-alpine
    container_name: soundit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: soundit
      POSTGRES_PASSWORD: soundit_dev
      POSTGRES_DB: soundit_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundit -d soundit_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soundit-network

  # Redis Cache (for rate limiting, sessions)
  redis:
    image: redis:7-alpine
    container_name: soundit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - soundit-network

  # Main Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soundit-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://soundit:soundit_dev@db:5432/soundit_dev
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=True
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soundit-network

volumes:
  postgres_data:

networks:
  soundit-network:
    driver: bridge
