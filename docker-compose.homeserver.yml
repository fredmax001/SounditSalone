version: '3.8'

# Home server deployment - uses existing postgres/redis from soundit-cloud stack
# and builds the app image from a cached Alpine base to avoid Docker Hub pulls.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.homeserver
    container_name: soundit-backend-app
    environment:
      DATABASE_URL: postgresql://soundit:Soundit@2020@soundit-postgres:5432/soundit_db
      REDIS_URL: redis://soundit-redis:6379/0
      CELERY_BROKER_URL: redis://soundit-redis:6379/0
      CELERY_RESULT_BACKEND: redis://soundit-redis:6379/0
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    networks:
      - soundit-cloud_soundit-network
    ports:
      - "80:8000"
    # Run migrations before starting the server
    command: >
      sh -c "alembic upgrade head &&
             python3 -m uvicorn main_production:app
             --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.homeserver
    container_name: soundit-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://soundit:Soundit@2020@soundit-postgres:5432/soundit_db
      REDIS_URL: redis://soundit-redis:6379/0
      CELERY_BROKER_URL: redis://soundit-redis:6379/0
      CELERY_RESULT_BACKEND: redis://soundit-redis:6379/0
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    networks:
      - soundit-cloud_soundit-network
    command: celery -A tasks worker --loglevel=info --concurrency=2

networks:
  soundit-cloud_soundit-network:
    external: true
